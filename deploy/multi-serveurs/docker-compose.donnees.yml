# =============================================================================
# FANDRIO — SERVEUR DE DONNÉES (multi-serveurs) : PostgreSQL, PgBouncer, Redis
# =============================================================================
# PRÉPARÉ, PAS ACTIVÉ. À lancer sur le serveur de données uniquement, depuis la
# racine du dépôt :
#   docker compose --env-file deploy/multi-serveurs/.env.donnees \
#     -f deploy/multi-serveurs/docker-compose.donnees.yml up -d --build
#
# PgBouncer (6432) et Redis (6379) n'écoutent que sur l'adresse du RÉSEAU PRIVÉ
# (IP_PRIVEE) : jamais sur l'adresse publique. PostgreSQL n'est joignable que
# par PgBouncer, sur le réseau Docker de ce serveur.
# Guide complet : deploy/multi-serveurs/GUIDE_BASCULE.md
# =============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: fandrio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fandrio}
      POSTGRES_USER: ${DB_USERNAME:-fandrio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit être défini}
    # Réglages pour un serveur dédié (à ajuster à la mémoire du serveur :
    # shared_buffers ~ 25 % de la RAM, effective_cache_size ~ 70 %)
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - timezone=Indian/Antananarivo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../docker/postgres/init:/docker-entrypoint-initdb.d
      - ../../database/SQLRequetes:/docker-entrypoint-initdb.d/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fandrio}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - donnees

  pgbouncer:
    build:
      context: ../../docker/pgbouncer
    image: fandrio-pgbouncer:latest
    container_name: fandrio_pgbouncer
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-fandrio}
      DB_USERNAME: ${DB_USERNAME:-fandrio}
      DB_PASSWORD: ${DB_PASSWORD}
      PGBOUNCER_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-60}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-3000}
    ports:
      - "${IP_PRIVEE:?IP_PRIVEE doit être définie}:6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - donnees

  # Cache, limiteurs de requêtes, liste noire JWT, files de tâches, verrous du
  # planificateur, diffusion Reverb entre serveurs. Mot de passe obligatoire :
  # Redis est joignable depuis le réseau privé.
  redis:
    image: redis:7-alpine
    container_name: fandrio_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD doit être défini}"]
    ports:
      - "${IP_PRIVEE}:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - donnees

volumes:
  pgdata:
  redisdata:

networks:
  donnees:
    driver: bridge
