# =============================================================================
# FANDRIO — RÉPARTITEUR DE CHARGE (nginx, hors Docker)
# =============================================================================
# PRÉPARÉ, PAS ACTIVÉ. Sur le serveur qui reçoit le trafic public (DNS de l'API
# et des WebSockets). Copier dans /etc/nginx/conf.d/fandrio.conf, remplacer :
#   10.0.0.11, 10.0.0.12      adresses PRIVÉES des serveurs API
#   api.fandrio.mg            domaine de l'API
#   ws.fandrio.mg             domaine des WebSockets (REVERB_PUBLIC_HOST)
#   chemins des certificats   (certbot --nginx)
# puis : nginx -t && systemctl reload nginx
#
# Ajouter un serveur API = une ligne dans chaque bloc upstream, puis reload.
# Retirer un serveur pour maintenance : le passer en « down », reload.
# =============================================================================

# ── Requêtes HTTP de l'API ──────────────────────────────────────────────────
upstream fandrio_api {
    # Le moins de requêtes en cours : utile avec des requêtes de durée inégale
    least_conn;
    # max_fails / fail_timeout : un serveur qui ne répond plus est écarté 30 s
    server 10.0.0.11:80 max_fails=3 fail_timeout=30s;
    server 10.0.0.12:80 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

# ── WebSockets (Reverb) ─────────────────────────────────────────────────────
# Les Reverb se relaient les messages par Redis : un client peut être connecté
# à n'importe quel serveur. ip_hash garde le même serveur à la reconnexion.
upstream fandrio_ws {
    ip_hash;
    server 10.0.0.11:8080 max_fails=3 fail_timeout=30s;
    server 10.0.0.12:8080 max_fails=3 fail_timeout=30s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name api.fandrio.mg ws.fandrio.mg;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name api.fandrio.mg;

    ssl_certificate     /etc/letsencrypt/live/api.fandrio.mg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fandrio.mg/privkey.pem;

    server_tokens off;
    client_max_body_size 10M;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Adresse réelle du client : Laravel la lit dans X-Forwarded-For
        # (proxys de confiance = réseau privé, cf. TrustProxies)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # Erreur ou délai dépassé sur un serveur : la requête est rejouée sur
        # un autre, sauf pour les POST/PATCH/DELETE (jamais deux paiements)
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_pass http://fandrio_api;
    }
}

server {
    listen 443 ssl http2;
    server_name ws.fandrio.mg;

    ssl_certificate     /etc/letsencrypt/live/ws.fandrio.mg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.fandrio.mg/privkey.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Connexions WebSocket longues
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://fandrio_ws;
    }
}
