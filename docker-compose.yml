x-app-env: &app-env
  DB_HOST: postgres
  DB_PORT: 5432
  REVERB_HOST: reverb
  REVERB_APP_ID: ${REVERB_APP_ID}
  REVERB_APP_KEY: ${REVERB_APP_KEY}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET}
  REVERB_PORT: ${REVERB_PORT:-8080}
  REVERB_SCHEME: ${REVERB_SCHEME:-http}
  BROADCAST_DRIVER: ${BROADCAST_DRIVER:-reverb}
  # Sous Docker : cache, rate-limiter, blacklist JWT et queue dans Redis
  # (le .env local peut rester en file/sync pour le dev hors Docker)
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: null
  CACHE_DRIVER: redis
  QUEUE_CONNECTION: redis

services:
  # ── PHP-FPM (Laravel app) ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fandrio_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fandrio

  # ── Nginx ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: fandrio_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18010}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - fandrio

  # ── PostgreSQL ─────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: fandrio_postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT_FORWARD:-55432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fandrio}
      POSTGRES_USER: ${DB_USERNAME:-fandrio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
      - ./database/SQLRequetes:/docker-entrypoint-initdb.d/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fandrio}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fandrio

  # ── Laravel Reverb (WebSockets) ────────────────────────────────────
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fandrio_reverb
    restart: unless-stopped
    working_dir: /var/www
    entrypoint: ["entrypoint.sh"]
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_PORT_FORWARD:-18080}:8080"
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fandrio

  # ── Scheduler (cron tasks) ─────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fandrio_scheduler
    restart: unless-stopped
    working_dir: /var/www
    entrypoint: ["entrypoint.sh"]
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fandrio

  # ── Queue worker (push notifications, broadcasts WebSocket) ──────
  # queue:listen recharge le code à chaque job (pratique en dev avec le
  # bind-mount). En prod : queue:work (cf. docker-compose.prod.yml).
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fandrio_queue
    restart: unless-stopped
    working_dir: /var/www
    entrypoint: ["entrypoint.sh"]
    command: ["php", "artisan", "queue:listen", "--tries=3", "--timeout=60"]
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fandrio

  # ── Redis (cache, rate-limiter, queue) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fandrio_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fandrio

  # ── pgAdmin ────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fandrio_pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-15050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@fandrio.mg}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fandrio

volumes:
  pgdata:
  redisdata:
  pgadmin_data:

networks:
  fandrio:
    driver: bridge
