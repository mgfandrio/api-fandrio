# =============================================================================
# Nginx devant Laravel Octane (Swoole) — utilisé par docker-compose.octane.yml
# Les fichiers publics sont servis par nginx ; tout le reste part vers Octane
# (app:8000) en HTTP, au lieu de FastCGI vers PHP-FPM (default.conf).
# =============================================================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream octane {
    server app:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    root /var/www/public;

    charset utf-8;
    server_tokens off;

    # Compression des réponses JSON (réseaux mobiles)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json text/plain text/css application/javascript;

    # Max upload size (logos)
    client_max_body_size 10M;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Fichier public existant : servi directement, sinon Octane
    location / {
        try_files $uri @octane;
    }

    location @octane {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_pass http://octane;
    }
}
