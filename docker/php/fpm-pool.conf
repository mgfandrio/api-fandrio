; =============================================================================
; FANDRIO — Pool PHP-FPM
; =============================================================================
; Installé en /usr/local/etc/php-fpm.d/zz-fandrio.conf : chargé APRÈS
; www.conf et zz-docker.conf de l'image officielle, donc ses valeurs gagnent.
;
; Sans ce fichier, l'image php:fpm utilise pm.max_children = 5 : au-delà de
; 5 requêtes simultanées, les suivantes font la queue puis tombent en 504.
;
; Dimensionnement de PHP_FPM_MAX_CHILDREN (variables d'env, cf. Dockerfile) :
;   RAM dispo pour PHP / mémoire moyenne d'un worker (~40-60 Mo pour l'API)
;   ex. 2 Go réservés à PHP / 50 Mo ≈ 40 workers
; Vérifier la conso réelle : docker stats fandrio_app
; =============================================================================

[www]
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}

; Recycle les workers pour contenir d'éventuelles fuites mémoire
pm.max_requests = 1000

; File d'attente des connexions entrantes quand tous les workers sont occupés
listen.backlog = 1024

; Tue une requête bloquée (ex. appel HTTP externe sans timeout) au lieu
; de monopoliser un worker indéfiniment
request_terminate_timeout = 60s

; Page de statut (workers actifs/en attente) — non exposée par nginx
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Garde les variables d'environnement du conteneur (DB_HOST, REVERB_*, ...)
clear_env = no
