; =============================================================================
; FANDRIO — réglages PHP propres à Laravel Octane (docker-compose.octane.yml)
; =============================================================================
; Octane tourne en ligne de commande (php artisan octane:start) : sans
; opcache.enable_cli, chaque worker recompile tout Laravel à son démarrage et
; à chaque recyclage (--max-requests). Monté en conf.d/zz-octane.ini, donc
; appliqué après php-prod.ini.
; =============================================================================

opcache.enable_cli = 1

; Compilation à la volée du code le plus exécuté (PHP 8 JIT)
opcache.jit = tracing
opcache.jit_buffer_size = 64M
