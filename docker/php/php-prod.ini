[PHP]
; =============================================================================
; FANDRIO — php.ini PRODUCTION
; =============================================================================
; Copié dans l'image en conf.d/custom.ini. En dev, docker-compose.yml monte
; docker/php/php.ini par-dessus (même chemin) : ce fichier ne s'applique donc
; qu'à l'image de production (docker-compose.prod.yml).
; =============================================================================

; Timezone
date.timezone = UTC

; Upload
upload_max_filesize = 10M
post_max_size = 12M

; Memory / exécution
memory_limit = 256M
max_execution_time = 30

; Ne jamais exposer PHP ni les erreurs aux clients
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; Cache des chemins résolus (Laravel charge des centaines de fichiers)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Opcache — le code ne change pas dans un conteneur de prod : on ne vérifie
; plus les fichiers sur disque à chaque requête (validate_timestamps = 0).
; => Tout changement de code nécessite un rebuild/redémarrage du conteneur.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
